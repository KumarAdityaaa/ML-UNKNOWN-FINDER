<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Unknown Finder Dashboard</title>
<style>
body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; line-height: 1.5; }
.card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 16px 0; }
.metric { font-size: 2rem; font-weight: bold; }
</style>
</head>
<body>
<h1>AI Unknown Finder Dashboard</h1>

<div class="card">
<h2>Discovery</h2>
<p>Detected gaps: <span class="metric">1</span></p>
<ul><li>attention ? medical imaging</li></ul>
</div>

<div class="card">
<h2>Evaluation</h2>
<p>Dataset score: <span class="metric">1.00</span></p>
<p>Human evaluation score: <span class="metric">0.80</span></p>
<p>Ablation difference: <span class="metric">-0.20</span></p>
</div>
</body>
</html>
